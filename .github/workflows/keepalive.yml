name: FYSH keep-alive

# يمنع خمول خدمة Render المجانية (تنام بعد 15 دقيقة بلا زيارات)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping FYSH health endpoint
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://fysh.online/api/health || true)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "service did not answer 200 yet (cold start?)"
